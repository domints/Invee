name: Build Flutter APK

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'invee_flutter/**'
      - '.github/workflows/flutter-apk.yml'
  pull_request:
    branches: [master]
    paths:
      - 'invee_flutter/**'
      - '.github/workflows/flutter-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: invee_flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        run: flutter build apk --release --build-name=${{ steps.version.outputs.version }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: invee-${{ steps.version.outputs.version }}.apk
          path: invee_flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: invee_flutter/build/app/outputs/flutter-apk/app-release.apk
          name: ${{ steps.version.outputs.version }}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 215">

  <!-- Box body (front wall — label area) -->
  <rect x="14" y="81" width="172" height="119" rx="5" fill="#FDD672"/>

  <!-- Left open flap (trapezoid, tapers inward toward bottom) -->
  <polygon points="14,81 76,81 54,40 14,40" fill="#EEC040"/>

  <!-- Right open flap -->
  <polygon points="124,81 186,81 186,40 146,40" fill="#EEC040"/>

  <!-- Cat left ear (triangle, base merges into head) -->
  <polygon points="68,52 62,14 83,44" fill="#1A1A1A"/>
  <!-- Cat right ear -->
  <polygon points="132,52 138,14 117,44" fill="#1A1A1A"/>

  <!-- Cat head -->
  <ellipse cx="100" cy="56" rx="42" ry="38" fill="#1A1A1A"/>

  <!-- Left eye -->
  <circle cx="85" cy="51" r="10" fill="white"/>
  <circle cx="86" cy="52" r="6" fill="#1A1A1A"/>
  <circle cx="84" cy="49" r="2.5" fill="white"/>

  <!-- Right eye -->
  <circle cx="115" cy="51" r="10" fill="white"/>
  <circle cx="116" cy="52" r="6" fill="#1A1A1A"/>
  <circle cx="114" cy="49" r="2.5" fill="white"/>

  <!-- Cat nose (inverted heart: two bumps at top, point at bottom) -->
  <path d="M 100,74 L 95,68 Q 96,63 100,65 Q 104,63 105,68 Z" fill="#FF8FAB"/>

  <!-- Left paw toes (drawn after flaps so they sit on top) -->
  <circle cx="49" cy="75" r="8" fill="#1A1A1A"/>
  <circle cx="58" cy="71" r="8" fill="#1A1A1A"/>
  <circle cx="67" cy="71" r="8" fill="#1A1A1A"/>
  <circle cx="75" cy="75" r="8" fill="#1A1A1A"/>

  <!-- Right paw toes -->
  <circle cx="125" cy="75" r="8" fill="#1A1A1A"/>
  <circle cx="133" cy="71" r="8" fill="#1A1A1A"/>
  <circle cx="142" cy="71" r="8" fill="#1A1A1A"/>
  <circle cx="151" cy="75" r="8" fill="#1A1A1A"/>

  <!-- Box top rim — drawn last, covers cat chin and paw bases -->
  <rect x="14" y="81" width="172" height="15" fill="#EEC040"/>

</svg>
